[graph]
all-features = true
targets = [
    "x86_64-pc-windows-msvc",
    "aarch64-pc-windows-msvc",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
]

[advisories]
unmaintained = "workspace"
yanked = "deny"
ignore = [
    { id = "RUSTSEC-2026-0194", reason = "quick-xml 0.38 comes from typst 0.15.1 through hayagriva and citationberg, which have no fixed release. Remove when typst updates." },
    { id = "RUSTSEC-2026-0195", reason = "quick-xml 0.38 comes from typst 0.15.1 through hayagriva and citationberg, which have no fixed release. Remove when typst updates." },
]

[licenses]
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "OFL-1.1",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.9
unused-allowed-license = "allow"

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
