[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
license = "Apache-2.0"
repository = "https://github.com/getpresswork/presswork"
homepage = "https://getpresswork.github.io/presswork/"
publish = false

[workspace.dependencies]
presswork-ui = { path = "crates/presswork-ui" }

fluent-bundle = "0.16.0"
iced = "0.14.0"
iced_test = "0.14.0"
jiff = "0.2.45"
tracing = "0.1.44"
unic-langid = "0.9.6"

[workspace.lints.rust]
rust_2018_idioms = { level = "warn", priority = -1 }
unreachable_pub = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
dbg_macro = "warn"
expect_used = "warn"
todo = "warn"
unimplemented = "warn"
unwrap_used = "warn"
