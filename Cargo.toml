[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
license = "Apache-2.0"
repository = "https://github.com/getpresswork/presswork"
homepage = "https://getpresswork.github.io/presswork/"
publish = false

[workspace.dependencies]
presswork-editor = { path = "crates/presswork-editor" }
presswork-log = { path = "crates/presswork-log" }
presswork-preview = { path = "crates/presswork-preview" }
presswork-text = { path = "crates/presswork-text" }
presswork-typst = { path = "crates/presswork-typst" }
presswork-ui = { path = "crates/presswork-ui" }

comemo = "0.5.1"
directories = "6.0.0"
fluent-bundle = "0.16.0"
futures = "0.3.34"
iced = "0.14.0"
iced_test = "0.14.0"
jiff = "0.2.45"
lucide-icons = { version = "1.73.0", default-features = false }
proptest = "1.12.0"
ropey = "1.6.1"
serde ={ version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
skrifa = "0.44.0"
tempfile = "3.27.0"
thiserror = "2.0.21"
toml = "1.2.1"
tracing = "0.1.44"
tracing-appender = "0.2.5"
typst = "0.15.1"
typst-assets = { version = "0.15.1", features = ["fonts"] }
typst-layout = "0.15.1"
typst-render = "0.15.1"
typst-syntax = "0.15.1"
tracing-subscriber ={ version = "0.3.23", default-features = false, features = ["std", "registry", "env-filter", "tracing-log"] }
unic-langid = "0.9.6"
unicode-segmentation = "1.13.3"

[workspace.lints.rust]
rust_2018_idioms = { level = "warn", priority = -1 }
unreachable_pub = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
dbg_macro = "warn"
expect_used = "warn"
todo = "warn"
unimplemented = "warn"
unwrap_used = "warn"

[profile.dev.package."*"]
opt-level = 2
