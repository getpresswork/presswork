[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
license = "Apache-2.0"
repository = "https://github.com/getpresswork/presswork"
homepage = "https://getpresswork.github.io/presswork/"
publish = false

[workspace.dependencies]
presswork-api = { path = "crates/presswork-api" }
presswork-client = { path = "crates/presswork-client" }
presswork-domain = { path = "crates/presswork-domain" }
presswork-editor = { path = "crates/presswork-editor" }
presswork-language = { path = "crates/presswork-language" }
presswork-library = { path = "crates/presswork-library" }
presswork-log = { path = "crates/presswork-log" }
presswork-ocr = { path = "crates/presswork-ocr", default-features = false }
presswork-preview = { path = "crates/presswork-preview" }
presswork-project = { path = "crates/presswork-project" }
presswork-search = { path = "crates/presswork-search" }
presswork-sync = { path = "crates/presswork-sync" }
presswork-text = { path = "crates/presswork-text" }
presswork-toolchain = { path = "crates/presswork-toolchain" }
presswork-typst = { path = "crates/presswork-typst" }
presswork-ui = { path = "crates/presswork-ui" }

argon2 = "0.6.0"
axum = "0.8.9"
clap = { version = "4.6.7", features = ["derive"] }
comemo = "0.5.1"
directories = "6.0.0"
encoding_rs = "0.8.44"
fluent-bundle = "0.16.0"
futures = "0.3.34"
getrandom = "0.4.3"
hayagriva = "0.10.1"
hayro = "0.7.1"
hayro-interpret = "0.7.0"
http-body-util = "0.1.5"
iced = "0.14.0"
iced_test = "0.14.0"
jiff = "1.0.0"
jiff-sqlx = { version = "1.0.0", features = ["postgres"] }
kurbo = "0.13.1"
loro = { version = "1.18.0", default-features = false }
lzma-rust2 = { version = "0.25.0", default-features = false, features = ["std", "xz"] }
lucide-icons = { version = "1.73.0", default-features = false }
object_store = { version = "0.14.2", default-features = false, features = ["fs"] }
ocrs = { version = "0.14.0", default-features = false, features = ["onnx"] }
png = "0.18.1"
proptest = "1.12.0"
reqwest = "0.13.5"
resvg = { version = "0.47.0", default-features = false }
regex = "1.13.1"
rfd = "0.18.0"
rmp-serde = "1.3.1"
ropey = "1.6.1"
rten = { version = "0.28.0", default-features = false, features = ["onnx_format"] }
rustls = { version = "0.23.46", default-features = false, features = ["std", "tls12"] }
rustls-platform-verifier = "0.7.1"
semver = "1.0.28"
serde ={ version = "1.0.229", features = ["derive"] }
serde_bytes = "0.11.19"
serde_json = "1.0.154"
sha2 = "0.11.1"
skrifa = "0.44.0"
spellbook = "0.4.2"
sqlx = { version = "0.9.0", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls-ring-native-roots", "migrate", "macros", "uuid"] }
tantivy = { version = "0.27.0", default-features = false, features = ["mmap", "lz4-compression"] }
tar = { version = "0.4.46", default-features = false }
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = "1.54.1"
tokio-tungstenite = { version = "0.29.0", default-features = false }
tower = "0.5.3"
toml = "1.2.1"
toml_edit = "0.25.19"
tracing = "0.1.44"
tracing-appender = "0.2.5"
typst = "0.15.1"
typst-assets = { version = "0.15.1", features = ["fonts"] }
typst-ide = "0.15.1"
typst-layout = "0.15.1"
typst-pdf = "0.15.1"
typst-render = "0.15.1"
typst-svg = "0.15.1"
typst-syntax = "0.15.1"
tracing-subscriber ={ version = "0.3.23", default-features = false, features = ["std", "registry", "env-filter", "tracing-log"] }
unic-langid = "0.9.6"
unicode-segmentation = "1.13.3"
utoipa = "6.0.0"
uuid = { version = "1.29.2", features = ["v7"] }
zip = { version = "9.6.0", default-features = false, features = ["deflate-flate2"] }

[workspace.lints.rust]
rust_2018_idioms = { level = "warn", priority = -1 }
unreachable_pub = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
dbg_macro = "warn"
expect_used = "warn"
todo = "warn"
unimplemented = "warn"
unwrap_used = "warn"

[profile.dev.package."*"]
opt-level = 2
