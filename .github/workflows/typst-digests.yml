name: Typst digests

on:
  workflow_dispatch:
    inputs:
      versions:
        description: The Typst versions that have no published digest, separated by spaces.
        type: string
        default: 0.11.0 0.11.1 0.12.0 0.13.0 0.13.1

permissions:
  contents: read

jobs:
  digests:
    name: Calculate digests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Calculate digests
        env:
          GH_TOKEN: ${{ github.token }}
          VERSIONS: ${{ inputs.versions }}
        run: |
          read -r -a versions <<< "${VERSIONS}"
          bash .github/scripts/typst-digests.sh digests.txt "${versions[@]}"
          { echo '```text'; cat digests.txt; echo '```'; } >> "${GITHUB_STEP_SUMMARY}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: typst-digests
          path: digests.txt
          if-no-files-found: error
