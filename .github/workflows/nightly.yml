name: Nightly

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  check:
    name: Look for new commits
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.check.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: check
        run: |
          set -euo pipefail
          nightly=$(git rev-parse -q --verify 'refs/tags/nightly^{commit}' || true)
          if [[ "${nightly}" == "$(git rev-parse HEAD)" ]]; then
            echo "The nightly build is current."
            echo "changed=false" >> "${GITHUB_OUTPUT}"
          else
            echo "changed=true" >> "${GITHUB_OUTPUT}"
          fi

  build:
    needs: check
    if: needs.check.outputs.changed == 'true'
    uses: ./.github/workflows/build.yml
    permissions:
      contents: read
      packages: write
    with:
      label: nightly
      publish: true

  image:
    name: Publish the nightly server image
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Join the images of the two architectures
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo "${GH_TOKEN}" | docker login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin
          bash .github/scripts/publish-server-image.sh nightly

  publish:
    name: Publish nightly build
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Write checksums
        working-directory: dist
        run: sha256sum presswork-* > SHA256SUMS
      - name: Publish nightly build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sha=$(git rev-parse HEAD)
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/nightly" > /dev/null 2>&1; then
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/git/refs/tags/nightly" -f sha="${sha}" -F force=true > /dev/null
          else
            gh api -X POST "repos/${GITHUB_REPOSITORY}/git/refs" -f ref=refs/tags/nightly -f sha="${sha}" > /dev/null
          fi
          notes="Nightly build of $(git rev-parse --short HEAD), $(date -u +%Y-%m-%d). Nightly builds are for tests. They can contain errors."
          if gh release view nightly > /dev/null 2>&1; then
            gh release edit nightly --prerelease --title "Nightly build" --notes "${notes}"
            gh release upload nightly dist/presswork-* dist/SHA256SUMS --clobber
          else
            gh release create nightly dist/presswork-* dist/SHA256SUMS --prerelease --title "Nightly build" --notes "${notes}"
          fi
