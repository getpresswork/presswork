name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install
      - run: rustup target add ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.target }}
      - run: cargo build --release --locked --package presswork --target ${{ matrix.target }}

      - name: Package archive
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          name="presswork-${GITHUB_REF_NAME//\//-}-${TARGET}"
          mkdir -p "dist/${name}"
          cp "target/${TARGET}/release/presswork" LICENSE NOTICE README.md "dist/${name}/"
          tar -czf "dist/${name}.tar.gz" -C dist "${name}"

      - name: Package archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $name = "presswork-$($env:GITHUB_REF_NAME -replace '/', '-')-$env:TARGET"
          New-Item -ItemType Directory -Force "dist/$name" | Out-Null
          Copy-Item "target/$env:TARGET/release/presswork.exe", LICENSE, NOTICE, README.md "dist/$name/"
          Compress-Archive -Path "dist/$name" -DestinationPath "dist/$name.zip"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: presswork-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error

  notes:
    name: Release notes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: taiki-e/install-action@4a76afe23f9e08d2d9550fb56e556444e8611d21 # v2.90.4
        with:
          tool: git-cliff@2.14.2
      - name: Write release notes
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then range=--latest; else range=--unreleased; fi
          git cliff "${range}" --strip header --output notes.md
          cat notes.md >> "${GITHUB_STEP_SUMMARY}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: notes
          path: notes.md
          if-no-files-found: error

  publish:
    name: Publish release
    needs: [build, notes]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Write checksums
        working-directory: dist
        run: sha256sum presswork-* > SHA256SUMS
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          flags=()
          if [[ "${GITHUB_REF_NAME}" == v0.* ]]; then flags+=(--prerelease); fi
          gh release create "${GITHUB_REF_NAME}" dist/presswork-* dist/SHA256SUMS \
            --repo "${GITHUB_REPOSITORY}" \
            --title "Presswork ${GITHUB_REF_NAME#v}" \
            --notes-file dist/notes.md \
            --verify-tag \
            "${flags[@]}"
