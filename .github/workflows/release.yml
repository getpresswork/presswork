name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/build.yml
    permissions:
      contents: read
      packages: write
    with:
      label: ${{ github.ref_name }}
      publish: ${{ startsWith(github.ref, 'refs/tags/v') }}

  image:
    name: Publish the server image
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Join the images of the two architectures
        env:
          GH_TOKEN: ${{ github.token }}
          LABEL: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          echo "${GH_TOKEN}" | docker login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin
          bash .github/scripts/publish-server-image.sh "${LABEL}"

  notes:
    name: Release notes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: taiki-e/install-action@4a76afe23f9e08d2d9550fb56e556444e8611d21 # v2.90.4
        with:
          tool: git-cliff@2.14.2
      - name: Write release notes
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then range=--latest; else range=--unreleased; fi
          git cliff "${range}" --strip header --output notes.md
          cat notes.md >> "${GITHUB_STEP_SUMMARY}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: notes
          path: notes.md
          if-no-files-found: error

  publish:
    name: Publish release
    needs: [build, notes]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Write checksums
        working-directory: dist
        run: sha256sum presswork-* > SHA256SUMS
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          flags=()
          if [[ "${GITHUB_REF_NAME}" == v0.* ]]; then flags+=(--prerelease); fi
          gh release create "${GITHUB_REF_NAME}" dist/presswork-* dist/SHA256SUMS \
            --repo "${GITHUB_REPOSITORY}" \
            --title "Presswork ${GITHUB_REF_NAME#v}" \
            --notes-file dist/notes.md \
            --verify-tag \
            "${flags[@]}"
