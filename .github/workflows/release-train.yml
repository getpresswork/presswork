name: Release train

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      dry-run:
        description: Calculate the next version, but change nothing.
        type: boolean
        default: true
      version:
        description: Release this version, for example 0.2.0 at the end of milestone 2. Keep it empty to calculate the version.
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: release-train
  cancel-in-progress: false

jobs:
  train:
    name: Release train
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Look for release commits
        id: check
        env:
          EVENT: ${{ github.event_name }}
          REQUESTED: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ -n "${REQUESTED}" ]]; then
            echo "release=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          week=$((10#$(date -u +%V)))
          if [[ "${EVENT}" == "schedule" && $((week % 2)) -ne 0 ]]; then
            echo "Week ${week} is odd. The train runs only in even weeks." >> "${GITHUB_STEP_SUMMARY}"
            echo "release=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          last=$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2> /dev/null || true)
          range="HEAD"
          if [[ -n "${last}" ]]; then range="${last}..HEAD"; fi
          subjects=$(git log --format=%s "${range}")
          if grep -Eq '^(feat|fix|perf)(\([a-z0-9-]+\))?!?: ' <<< "${subjects}"; then
            echo "release=true" >> "${GITHUB_OUTPUT}"
          else
            echo "No feat, fix, or perf commits since ${last:-the first commit}." >> "${GITHUB_STEP_SUMMARY}"
            echo "release=false" >> "${GITHUB_OUTPUT}"
          fi

      - if: steps.check.outputs.release == 'true'
        run: rustup toolchain install

      - if: steps.check.outputs.release == 'true'
        uses: taiki-e/install-action@4a76afe23f9e08d2d9550fb56e556444e8611d21 # v2.90.4
        with:
          tool: git-cliff@2.14.2

      - name: Bump the version
        if: steps.check.outputs.release == 'true'
        id: bump
        env:
          REQUESTED: ${{ inputs.version }}
        run: |
          set -euo pipefail
          last=$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2> /dev/null || true)
          current=$(sed -n '0,/^version = "\(.*\)"$/s//\1/p' Cargo.toml)
          calculated=$(git cliff --bumped-version 2> /dev/null || true)
          version=$(bash .github/scripts/next-version.sh "${last}" "${REQUESTED}" "${current}" "${calculated}")
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "Next version: ${version}" >> "${GITHUB_STEP_SUMMARY}"
          sed -i "0,/^version = \".*\"/s//version = \"${version}\"/" Cargo.toml
          cargo update --workspace
          git cliff --tag "v${version}" --output CHANGELOG.md
          git diff --stat

      - name: Commit, tag, and start the release
        if: steps.check.outputs.release == 'true' && inputs.dry-run != true
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock CHANGELOG.md
          git commit -m "chore(release): ${VERSION}"
          git push origin HEAD:main
          gh api -X POST "repos/${GITHUB_REPOSITORY}/git/refs" -f ref="refs/tags/v${VERSION}" -f sha="$(git rev-parse HEAD)" > /dev/null
          gh workflow run release.yml --ref "v${VERSION}"
