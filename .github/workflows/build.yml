name: Build

on:
  workflow_call:
    inputs:
      label:
        description: The label in the archive names, for example v0.2.0 or nightly.
        type: string
        required: true
  workflow_dispatch:
    inputs:
      label:
        description: The label in the package names.
        type: string
        default: test

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    env:
      TARGET: ${{ matrix.target }}
      LABEL: ${{ inputs.label }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install
      - run: rustup target add ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.target }}
      - run: cargo build --release --locked --package presswork --target ${{ matrix.target }}

      - name: Package archive
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          name="presswork-${LABEL//\//-}-${TARGET}"
          mkdir -p "dist/${name}"
          cp "target/${TARGET}/release/presswork" LICENSE NOTICE README.md "dist/${name}/"
          tar -czf "dist/${name}.tar.gz" -C dist "${name}"

      - name: Package archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $name = "presswork-$($env:LABEL -replace '/', '-')-$env:TARGET"
          New-Item -ItemType Directory -Force "dist/$name" | Out-Null
          Copy-Item "target/$env:TARGET/release/presswork.exe", LICENSE, NOTICE, README.md "dist/$name/"
          Compress-Archive -Path "dist/$name" -DestinationPath "dist/$name.zip"

      - name: Read the version
        shell: bash
        run: echo "VERSION=$(awk -F '"' '/^version = /{print $2; exit}' Cargo.toml)" >> "${GITHUB_ENV}"

      - name: Make the Linux packages
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends rpm
          tools="${RUNNER_TEMP}/appimage-tools"
          bash .github/scripts/package-tools.sh "appimage-${TARGET%%-*}" "${tools}"
          bash .github/scripts/package-linux.sh "${TARGET}" "${LABEL}" "${VERSION}" "${tools}"
          bash .github/scripts/check-linux-packages.sh "${TARGET}" "${LABEL}" "${VERSION}"

      - name: Make the DMG file
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          bash .github/scripts/package-macos.sh "${TARGET}" "${LABEL}" "${VERSION}"
          bash .github/scripts/check-macos-package.sh "${TARGET}" "${LABEL}" "${VERSION}"

      - name: Download WiX
        if: runner.os == 'Windows'
        shell: bash
        run: bash .github/scripts/package-tools.sh wix "$(cygpath -u "${RUNNER_TEMP}")/wix-tools"

      - name: Make the MSI file
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          DOTNET_CLI_TELEMETRY_OPTOUT: "1"
          DOTNET_NOLOGO: "1"
        run: |
          ./.github/scripts/package-windows.ps1 -Target $env:TARGET -Label $env:LABEL -Version $env:VERSION -Tools "$env:RUNNER_TEMP\wix-tools"
          ./.github/scripts/check-windows-package.ps1 -Target $env:TARGET -Label $env:LABEL -Version $env:VERSION

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: presswork-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.msi
            dist/*.dmg
            dist/*.deb
            dist/*.rpm
            dist/*.AppImage
          if-no-files-found: error
